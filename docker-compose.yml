version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: pmc-nginx
    ports:
      - "8087:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pmc-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pmc-frontend
    networks:
      - pmc-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmc-backend
    environment:
      - PORT=3000
      - DATA_PATH=/data
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceaccountkey.json
      - ADMIN_EMAILS=b25339@students.iitmandi.ac.in
    volumes:
      - ./data:/data
      - ./serviceaccountkey.json:/app/serviceaccountkey.json:ro
    networks:
      - pmc-network
    restart: unless-stopped

networks:
  pmc-network:
    driver: bridge
