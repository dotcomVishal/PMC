version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: pmc-nginx
    ports:
      - "8087:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pmc-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pmc-frontend
    networks:
      - pmc-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmc-backend
    networks:
      - pmc-network
    restart: unless-stopped

networks:
  pmc-network:
    driver: bridge
